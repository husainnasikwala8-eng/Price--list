<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C8161D">
<title>Raj Traders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="image.png">

<script>try{var t=localStorage.getItem('rt4_theme');document.documentElement.setAttribute('data-theme',t||'light')}catch(e){}</script>
<style>
:root{--bg:#F7F5F1;--sf:#fff;--ink:#1B2230;--mut:#6B7385;--line:#E8E4DC;--ac:#C8161D;--ac2:#E2483D;--on:#fff;--soft:color-mix(in srgb,var(--ac) 8%,#fff);--glow:rgba(200,22,29,.2);--r:18px;--shadow:0 8px 26px rgba(20,28,45,.08)}
[data-theme="dark"]{--bg:#0F1114;--sf:#1A1D22;--ink:#F2F3F5;--mut:#98A0AE;--line:#2A2E35;--ac:#E5393B;--ac2:#FF6B63;--soft:color-mix(in srgb,var(--ac) 16%,#1A1D22);--glow:rgba(229,57,59,.3);--shadow:0 8px 26px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Mukta','Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35;padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow-x:hidden}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
img{display:block}
.serif{font-family:'Playfair Display',serif}
.hdr{position:sticky;top:0;z-index:50;height:58px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:var(--ac);color:var(--on);box-shadow:0 2px 14px rgba(0,0,0,.18)}
.logo{display:flex;flex-direction:column;line-height:1;cursor:pointer;user-select:none}
.logo b{font-family:'Playfair Display',serif;font-size:1.05rem;letter-spacing:.16em}
.logo small{font-size:.68rem;opacity:.85;margin-top:3px;letter-spacing:.06em}
.hdr-r{display:flex;align-items:center;gap:8px}
.pill{height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.2);color:var(--on);font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:6px}
.pill i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.6}
.pill.ok i{background:#7CFF9B;opacity:1;animation:pulse 1.8s infinite}.pill.part i{background:#FFD36B;opacity:1}.pill.off i{background:#fff;opacity:.5}
@keyframes pulse{50%{opacity:.35}}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);font-weight:700;color:var(--on)}
.offline{display:none;background:#1B2230;color:#fff;font-size:.8rem;text-align:center;padding:7px 12px}
main{max-width:640px;margin:0 auto}
.hero{position:relative;margin:14px 14px 0;border-radius:24px;overflow:hidden;aspect-ratio:4/5;max-height:60vh;background:#000;box-shadow:0 18px 40px var(--glow)}
.hero.compact{aspect-ratio:2.6/1}
.hero-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hero-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;position:relative;scroll-snap-align:center;overflow:hidden;background:#111}
.slide.img::before{content:'';position:absolute;inset:-24px;background:var(--u) center/cover;filter:blur(22px) brightness(.5)}
.slide img,.slide video{position:relative;width:100%;height:100%;display:block}
.slide img{object-fit:contain}.slide video{object-fit:cover}
.hero.compact .slide img{object-fit:cover}
.hero-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.hero-dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.5);transition:all .3s}.hero-dots i.on{width:20px;background:#fff}
.hero-music{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.hero-music svg{width:20px;height:20px}
.hero-greet{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;padding:6px 14px;border-radius:16px;font-size:.82rem;backdrop-filter:blur(8px);display:none;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-3px)}}
.sbar-wrap{position:sticky;top:58px;z-index:40;padding:14px 14px 8px;background:linear-gradient(var(--bg) 75%,transparent)}
.sbar{width:100%;height:52px;border-radius:26px;background:var(--sf);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;color:var(--mut);text-align:left}

.quick{display:flex;gap:10px;padding:4px 14px 0}

.quick svg{width:18px;height:18px;color:var(--ac)}
.sec{padding:34px 14px 0}
.sh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;padding:0 4px}
.sh small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);margin-bottom:4px}

.brand-rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 4px 6px}

.bcard{flex:none;width:132px;height:78px;border-radius:16px;background:#fff;border:1.5px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:.92rem;color:#1B2230;text-align:center;transition:all .2s}

.fpills{display:flex;flex-wrap:wrap;gap:8px;margin:0 4px 14px}
.fp{height:34px;padding:0 14px;border-radius:17px;background:var(--soft);border:1px solid var(--ac);font-size:.82rem;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;animation:rise .45s both}

.pbox{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden}
.pbox img{width:100%;height:100%;object-fit:contain}
.brandtag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:#1B2230;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:8px}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.nm{font-weight:600;font-size:.95rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}

.prow{display:flex;align-items:center;justify-content:space-between;margin-top:auto;min-height:40px}
.price{font-family:'Playfair Display',serif;font-weight:700;font-size:1.18rem;color:var(--ac)}

.step{display:flex;align-items:center;gap:4px}

.showcase{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sc{background:var(--sf);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left}

.foot{margin:44px 0 0;padding:34px 22px 26px;background:#1C2A44;color:#E8ECF5;border-radius:28px 28px 0 0}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 0 max(8px,env(safe-area-inset-bottom))}

.cartbar{position:fixed;left:14px;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:55;height:52px;border-radius:26px;background:var(--ac);color:var(--on);font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 10px 26px var(--glow)}
.ovl{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}

.pd-in{padding:22px 4px}

.pd-price{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;color:var(--ac);margin-bottom:20px}
.tag{display:inline-block;padding:4px 12px;border-radius:12px;background:var(--soft);font-size:.74rem;font-weight:700;margin-right:6px}
.btn{height:50px;border-radius:25px;padding:0 24px;font-weight:700;background:var(--ac);color:var(--on);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px var(--glow)}
.btn.line{background:none;color:var(--ac);border:1.5px solid var(--ac);box-shadow:none}
.btn.block{width:100%}.btn[disabled]{opacity:.5}
.btn.danger{background:none;color:#C0392B;border:1.5px solid #C0392B;box-shadow:none}
.panel{background:var(--sf);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.panel h4{font-size:1rem;margin-bottom:12px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;outline:0}

.crow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.ocard{background:var(--sf);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}

.arow{display:flex;gap:12px;align-items:center;background:var(--sf);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:var(--shadow)}

#ashara{position:fixed;inset:0;z-index:400;background:radial-gradient(circle at 50% 25%,color-mix(in srgb,var(--ac) 30%,#0C0C0E),#0C0C0E 72%);color:#F3EEE2;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}

/* ---------- search engine ---------- */
function lev(a,b,m){const la=a.length,lb=b.length;if(Math.abs(la-lb)>m)return m+1;let p=[];for(let j=0;j<=lb;j++)p[j]=j;for(let i=1;i<=la;i++){let c=[i],mn=i;for(let j=1;j<=lb;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));c[j]=v;if(v<mn)mn=v}if(mn>m)return m+1;p=c}return p[lb]}
function search(q,lim){
 const qt=sn(q).split(' ').filter(Boolean);if(!qt.length)return[];const out=[];
 const score=(it,strict)=>{let tot=0,hit=0;for(const t of qt){let best=0;for(const w of it._t){let s=0;if(w===t)s=4;else if(w.startsWith(t))s=3;else if(t.length>=3&&w.includes(t))s=2;else if(t.length>=4){const m=t.length>=7?2:1;if(lev(w.slice(0,t.length+1),t,m)<=m||lev(w,t,m)<=m)s=1.2}if(s>best){best=s;if(s===4)break}}if(best){hit++;tot+=best}else if(strict)return 0}
  if(!hit)return 0;if(it._n.startsWith(qt[0]))tot+=1;return tot-it._n.length*.002+(hit===qt.length?0:-2)};
 for(const it of items){const s=score(it,true);if(s>0)out.push([s,it])}
 if(out.length<4&&qt.length>1)for(const it of items){if(out.some(o=>o[1]===it))continue;const s=score(it,false);if(s>0)out.push([s,it])}
 out.sort((a,b)=>b[0]-a[0]);return out.slice(0,lim).map(x=>x[1])}

 if($('admSync'))$('admSync').textContent=st==='ok'?'● Live':'● '+(st==='part'?'Partial':'Offline')}

function openSync(){$('syT').textContent=T('Connection status','कनेक्शन स्थिती');$('syBody').innerHTML=syncLines();openModal('sync')}

 {const n=el.children.length;$('heroDots').innerHTML=n>1?Array.from({length:n},(_,i)=>`<i class="${i?'':'on'}"></i>`).join(''):''}heroSync();paintMusic();paintViewers()}
const heroIdx=()=>{const t=$('heroTrack');return Math.round(t.scrollLeft/(t.clientWidth||1))};
function heroSync(){const t=$('heroTrack'),i=heroIdx();[...$('heroDots').children].forEach((d,k)=>d.classList.toggle('on',k===i));[...t.children].forEach((s,k)=>{const v=s.querySelector('video');if(v){v.muted=true;if(k===i&&heroVisible)v.play().catch(()=>{});else v.pause()}})}
let heroVisible=true,heroHold=0;

const Music={on:false,el:null,ctx:null,synth:false,CH:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],ci:0,
 f:m=>440*Math.pow(2,(m-69)/12),
 target(){return this.on&&heroVisible&&!document.hidden?1:0},
 start(){this.on=true;if(!this.el){const a=this.el=new Audio(CFG.musicUrl||'ad-music.mp3');a.loop=true;a.preload='auto';a.volume=0}
  const p=this.el.play();if(p&&p.catch)p.catch(()=>{if(this.on&&!this.synth){this.synth=true;this.startSynth()}});this.fade()},
 stop(){this.on=false;this.fade(true)},
 fade(final){const v=this.target()*.5;
  if(this.el){clearInterval(this.rt);this.rt=setInterval(()=>{const a=this.el,d=v-a.volume;if(Math.abs(d)<.03){a.volume=v;clearInterval(this.rt);if(v===0&&final)a.pause()}else a.volume=Math.max(0,Math.min(1,a.volume+Math.sign(d)*.03))},60)}
  if(this.ctx){this.master.gain.linearRampToValueAtTime(v*1.1,this.ctx.currentTime+1.4);if(v===0&&final)setTimeout(()=>clearInterval(this.tm),1600)}},
 startSynth(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  if(!this.ctx){const c=this.ctx=new C();this.master=c.createGain();this.master.gain.value=0;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1500;this.bus=c.createGain();this.bus.connect(fl);fl.connect(this.master);const d=c.createDelay(1);d.delayTime.value=.42;const fb=c.createGain();fb.gain.value=.38;const wet=c.createGain();wet.gain.value=.35;fl.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(this.master);this.master.connect(c.destination)}
  this.ctx.resume();this.nc=this.na=this.ctx.currentTime+.1;clearInterval(this.tm);this.tm=setInterval(()=>this.tick(),250);this.tick();this.fade()},
 tick(){const c=this.ctx,now=c.currentTime;while(this.nc<now+.8){const ch=this.CH[this.ci++%4];ch.forEach(m=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=this.f(m);g.gain.setValueAtTime(0,this.nc);g.gain.linearRampToValueAtTime(.055,this.nc+1.3);g.gain.linearRampToValueAtTime(0,this.nc+3.9);o.connect(g);g.connect(this.bus);o.start(this.nc);o.stop(this.nc+4)});this.nc+=3.6}
  while(this.na<now+.8){const ch=this.CH[(this.ci+3)%4],m=ch[Math.floor(Math.random()*3)]+12*(1+Math.floor(Math.random()*2)),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=this.f(m);g.gain.setValueAtTime(0,this.na);g.gain.linearRampToValueAtTime(.07,this.na+.02);g.gain.exponentialRampToValueAtTime(.0005,this.na+1.3);o.connect(g);g.connect(this.bus);o.start(this.na);o.stop(this.na+1.4);this.na+=.9}}};

$('keys').innerHTML=['1','2','3','4','5','6','7','8','9','←','0','✕'].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('');
const paintPin=()=>{$('pinDots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')};
async function pinKey(k){if(pinBusy)return;if(k==='✕'){closeModal('pin');return}if(k==='←'){pinBuf=pinBuf.slice(0,-1);paintPin();return}if(pinBuf.length>=4)return;pinBuf+=k;paintPin();if(pinBuf.length<4)return;pinBusy=true;let ok=false;
 try{ok=(await sha('rtv1:'+pinBuf))===PIN_HASH}catch(e){$('pinMsg').textContent='Needs a secure (https) page';pinBuf='';paintPin();pinBusy=false;return}pinBusy=false;
 if(ok){ls.s('rt4_fail',0);isAdmin=true;closeModal('pin');renderAshara();openAdmin()}
 else{const f=ls.g('rt4_fail',0)+1;ls.s('rt4_fail',f);pinBuf='';paintPin();if(f>=5){ls.s('rt4_lock',Date.now()+300000);ls.s('rt4_fail',0);$('pinMsg').textContent='Too many tries. Locked for 5 minutes.';setTimeout(()=>closeModal('pin'),1500)}else $('pinMsg').textContent='Wrong PIN ('+(5-f)+' tries left)'}}

async function compress(file,max,q){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
 const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,s=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/jpeg',q);return{dataUrl,kb:Math.round(dataUrl.length*.75/1024),orig:Math.round(file.size/1024)}}
async function pickPhoto(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;try{editPh=await compress(f,1000,.8);$('ePv').innerHTML=`<img src="${editPh.dataUrl}" alt="">`;$('eHint').textContent=`Converted: ${editPh.orig} KB → ${editPh.kb} KB (light JPEG). It uploads when you save.`}catch(e){$('eErr').textContent='Could not read that photo.'}}
const photoApi=()=>CFG.photoApi||ls.g('rt4_papi','');
async function svc(body){const api=photoApi();if(!api)throw new Error('Photo service not set up yet (Tools tab).');const r=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});const d=await r.json();if(d.status!=='ok')throw new Error(d.message||'Upload failed');return d}
const uploadPhoto=(it,u)=>svc({action:'photo',row:it.row,rawName:it.rawName,data:u.split(',')[1]}),uploadAsset=(u,name)=>svc({action:'asset',name,data:u.split(',')[1]});
async function saveEdit(next){const it=editRow?byRow[editRow]:null,name=$('eName').value.trim().replace(/\s+/g,' ');let cat=$('eCat').value;if(cat==='__new')cat=$('eNewCat').value.trim();const price=$('ePrice').value.trim().replace(/,/g,''),err=m=>{$('eErr').textContent=m};
 if(name.length<2)return err('Enter the item name.');if(!cat)return err('Choose or add a category.');if(!price||isNaN(Number(price)))return err('Enter a price (numbers only).');
 cat=cat[0].toUpperCase()+cat.slice(1);const k2=qn(cat)+':'+qn(name);if(items.find(x=>x.k2===k2&&(!it||x.row!==it.row)))return err('This item already exists in '+cat+'. Edit that one instead.');
 const b=$('eSave');b.disabled=true;b.textContent='Saving…';err('');
 try{if(it){if(name!==it.name||cat!==it.category){const r=await post({action:'rename',row:it.row,oldName:it.rawName,newName:cat+': '+name});if(r.status!=='ok')throw new Error(r.message||'Could not rename the item')}
   if(price!==it.price||name!==it.name||cat!==it.category){const r=await post({action:'upsert',category:cat,name,price,row:it.row,rawName:cat+': '+name});if(r.status==='ambiguous')throw new Error(r.message);if(r.status!=='ok')throw new Error(r.message||'Could not save the price')}}
  else{const r=await post({action:'upsert',category:cat,name,price});if(r.status==='ambiguous')throw new Error(r.message);if(r.status!=='ok')throw new Error(r.message||'Could not add the item')}
  await pull();
  if(editPh){const n=items.find(x=>x.k2===k2);if(!n)throw new Error('Saved, but the item was not found to attach the photo. Open it again and add the photo.');await uploadPhoto(n,editPh.dataUrl);await pull()}
  closeOv('edit');toast(it?'Saved':'Item added');if(next&&it){const L=admList(),i=L.findIndex(x=>x.row===it.row),nx=L.slice(i+1).find(x=>!x.photo&&x.row!==it.row)||L.find(x=>!x.photo&&x.row!==it.row);if(nx)setTimeout(()=>openEdit(nx.row),180)}}catch(e){err(e.message||'Something went wrong');b.disabled=false;b.textContent=it?'Save changes':'Add item'}}
async function delItem(){const it=byRow[editRow];if(!it||!confirm('Delete "'+it.name+'" permanently from the Sheet?'))return;const b=$('eSave');b.disabled=true;try{const r=await post({action:'delete',row:it.row,rawName:it.rawName});if(r.status!=='ok')throw new Error(r.message||'Could not delete');await pull();closeOv('edit');toast('Deleted')}catch(e){$('eErr').textContent=e.message;b.disabled=false}}

 ${d.useCol?`<div style="display:flex;gap:14px;margin-top:12px"><div class="fld" style="flex:1;margin:0"><label>Main colour</label><input type="color" value="${esc(d.fa)}" oninput="lkDraft.fa=this.value" style="padding:4px"></div><div class="fld" style="flex:1;margin:0"><label>Second colour</label><input type="color" value="${esc(d.fb)}" oninput="lkDraft.fb=this.value" style="padding:4px"></div></div>`:''}
 <div class="fld" style="margin:14px 0 0"><label>Show until (returns to Shop Red by itself)</label><input type="date" value="${esc(d.tUntil)}" oninput="lkDraft.tUntil=this.value"></div></div>
 <div class="panel"><h4>Extras</h4><div class="fld"><label>Seasonal picks keywords (blank = festival default)</label><input value="${esc(d.kw)}" oninput="lkDraft.kw=this.value" placeholder="paint, brush, roller"></div>${tg('viewers','Show live viewer count','“N viewing now” on the ad panel')}</div>
 <div class="panel"><h4>Ashara mode</h4>${tg('closed','Close the app for everyone','Locks every link and the installed app while online. Customers see your message.')}<div class="fld" style="margin-top:14px"><label>Heading</label><input value="${esc(d.ct)}" oninput="lkDraft.ct=this.value" placeholder="Closed for Ashara"></div><div class="fld"><label>Message</label><textarea rows="3" oninput="lkDraft.msg=this.value">${esc(d.msg)}</textarea></div><div class="fld" style="margin:0"><label>Reopens on (unlocks by itself after this date)</label><input type="date" value="${esc(d.until)}" oninput="lkDraft.until=this.value"></div></div><button class="btn block" onclick="saveLook()">Save look, festival and Ashara mode</button>`}
async function saveLook(){const d=lkDraft,u=d.until,tu=d.tUntil;if(await cloudSet({theme:d.theme,kw:d.kw.trim(),closed:d.closed,ct:d.ct.trim(),msg:d.msg.trim(),until:u,untilMs:u?new Date(u+'T23:59:59').getTime():0,banner:d.banner,fe:d.fe.trim(),fh:d.fh.trim(),fq:d.fq.trim(),fqm:d.fqm.trim(),fa:d.useCol?d.fa:'',fb:d.useCol?d.fb:'',themeUntil:tu,themeUntilMs:tu?new Date(tu+'T23:59:59').getTime():0,viewers:d.viewers}))lkDraft=null}
/* ---------- tools ---------- */
function admTools(){return`<div class="panel"><h4>Connections</h4><div style="font-size:.92rem;line-height:1.9">${syncLines()}</div>${window.rtIsAdmin?`<button class="btn line block" style="margin-top:12px;height:44px" onclick="rtAdminOut()">Sign out of cloud admin</button>`:''}</div>${cloudGate()}
 <div class="panel"><h4>Photo service</h4><div class="fld"><label>Web app URL</label><input id="tPapi" value="${esc(photoApi())}" placeholder="https://script.google.com/macros/s/…/exec"></div><div style="display:flex;gap:10px"><button class="btn line" style="flex:1;height:44px" onclick="testPapi()">Test</button><button class="btn" style="flex:1;height:44px" onclick="savePapi()">Save</button></div><div class="hint" id="tPh">Saves photos to Google Drive and writes the link into your Sheet's Photo column. Setup steps are inside the photo-service file.</div></div>
 <div class="panel"><h4>Base photos</h4><div class="fld"><label>Rules: words => image file (one per line)</label><textarea id="tRules" rows="7">${esc(CFG.rules||BASE_RULES_DEF)}</textarea></div><button class="btn block" style="height:44px" onclick="cloudSet({rules:$('tRules').value.trim()})">Save rules</button><div class="hint">Used only for items with no photo in the Sheet. A real photo always replaces it.</div></div>
 <div class="panel"><h4>Catalogue health</h4><div id="hlth" class="hint">Check for duplicates, doubled categories and blank prices.</div><div style="display:flex;gap:10px;margin-top:12px"><button class="btn line" style="flex:1;height:44px" onclick="diag()">Check</button><button class="btn danger" style="flex:1;height:44px" onclick="dedupe()">Clean duplicates</button></div></div>
 <div class="panel"><h4>Recent orders</h4><div id="ords" class="hint">${window.rtIsAdmin?'Loading…':'Sign in above to see orders.'}</div></div>`}
async function loadOrders(){try{const r=await rtRecentOrders();$('ords').innerHTML=r.length?r.map(o=>`<div class="crow"><div class="tx">${esc((o.customer&&o.customer.company)||'')} · ${esc((o.customer&&o.customer.name)||'')}<small>${esc(o.id)} · ${(o.items||[]).length} items · ₹${fmt(o.total||0)}${o.createdAt&&o.createdAt.toMillis?' · '+new Date(o.createdAt.toMillis()).toLocaleString('en-IN'):''}</small></div></div>`).join(''):'No orders yet.'}catch(e){$('ords').textContent='Could not load orders.'}}
function savePapi(){const v=$('tPapi').value.trim();ls.s('rt4_papi',v);CFG.photoApi=v;if(window.rtIsAdmin)cloudSet({photoApi:v});else toast('Saved on this phone')}
async function testPapi(){const v=$('tPapi').value.trim(),h=$('tPh');if(!v){h.textContent='Paste the web app URL first.';return}h.textContent='Testing…';try{const d=await (await fetch(v)).json();h.textContent=d&&d.service==='photo'?'Connected. Photo uploads will work.':'The URL answered, but it is not the photo service.'}catch(e){h.textContent='Could not reach that URL. Check it is deployed for “Anyone”.'}}
async function diag(){const h=$('hlth');h.textContent='Checking…';try{const r=await post({action:'diagnose'});if(r.status==='ok'&&r.counts){const c=r.counts;h.innerHTML=`Duplicate groups: <b>${c.duplicateGroups||0}</b><br>Doubled category names: <b>${c.doubledCategory||0}</b><br>Items without a category: <b>${c.generalOrphans||0}</b><br>Blank prices: <b>${c.blankPrice||0}</b>`}else h.textContent=r.message||'Unexpected answer from the Sheet.'}catch(e){h.textContent='Could not reach the Sheet.'}}
async function dedupe(){if(!confirm('Merge duplicate items? Extra copies are removed from the Sheet; the first copy keeps any price, photo or Marathi name the others had.'))return;try{const r=await post({action:'dedupe',confirm:true});if(r.status==='ok'){toast(`Merged ${r.merged||0} groups, removed ${r.removed||0} rows`);await pull();renderAdmin()}else toast(r.message||'Could not clean up')}catch(e){toast('Could not reach the Sheet')}}

async function addStatus(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(!window.rtIsAdmin){toast('Sign in first');return}try{const c=await compress(f,1280,.82);toast(`Converted ${c.orig} KB → ${c.kb} KB. Posting…`);const d=await uploadAsset(c.dataUrl,'status');await rtAdminAdd('status',{url:d.url,caption:($('stCapIn')||{value:''}).value.trim(),createdAt:Date.now()});toast('Status posted')}catch(x){toast(x.message||'Could not post')}}
async function delStatus(id){if(!window.rtIsAdmin||!confirm('Delete this status?'))return;try{await rtAdminDel('status',id)}catch(x){toast('Could not delete')}}

/* ---------- category pictures ---------- */
function admCats(){const L=catList(),ci=CFG.catImg||{};return cloudGate()+`<div class="hint" style="margin:0 4px 14px">Pictures for the “Shop by category” tiles. Upload a new picture, or choose one of your catalogue photos. Without one, a tile shows a photo of an item in that category, or an icon.</div>`+L.map((c,i)=>`<div class="arow"><div class="th" style="width:62px;height:62px">${catTile(c)}</div><div class="tx"><b>${esc(c.n)}</b><small>${c.c} items${ci[c.n]?' · custom picture':''}</small></div><div style="display:flex;flex-direction:column;gap:6px"><label class="sm" style="display:flex;align-items:center;justify-content:center">Upload<input type="file" accept="image/*" hidden onchange="pickCatImg(${i},this)"></label><button class="sm" onclick="openPicker(${i})">Catalogue</button></div>${ci[c.n]?`<button class="sm" style="color:#C0392B;border-color:#C0392B" onclick="clearCatImg(${i})">✕</button>`:''}</div>`).join('')}
async function pickCatImg(i,inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;const c=catList()[i];if(!c)return;try{const z=await compress(f,640,.85);toast(`Converted ${z.orig} KB → ${z.kb} KB. Uploading…`);const d=await uploadAsset(z.dataUrl,'cat');await cloudSet({catImg:{...(CFG.catImg||{}),[c.n]:d.url}})}catch(x){toast(x.message||'Upload failed')}}
async function clearCatImg(i){const c=catList()[i];if(!c)return;const o={...(CFG.catImg||{})};delete o[c.n];await cloudSet({catImg:o})}

/* ---------- choose a category picture from catalogue photos ---------- */
let pkIdx=-1,pkAll=false;
function openPicker(i){pkIdx=i;pkAll=false;renderPicker();openOv('picker')}
function renderPicker(){const c=catList()[pkIdx];if(!c)return;$('pkTitle').textContent=c.n;const cur=(CFG.catImg||{})[c.n]||'';
 const L=items.filter(x=>imgUrl(x)&&(pkAll||x.category===c.n)).sort((a,b)=>(b.photo?1:0)-(a.photo?1:0)).slice(0,120),on='background:var(--ac);color:var(--on);border-color:var(--ac)';
 $('pkBody').innerHTML=`<div class="chips"><button class="chip" style="${pkAll?'':on}" onclick="pkAll=false;renderPicker()">This category</button><button class="chip" style="${pkAll?on:''}" onclick="pkAll=true;renderPicker()">All items</button></div><div class="hint" style="margin:0 4px 14px">Tap a photo to use it for the “${esc(c.n)}” tile. It is saved and shown to everyone.</div>`+(L.length?`<div class="pkgrid">${L.map(x=>`<button class="${cur&&(x.photo===cur||baseUrl(x)===cur)?'cur':''}" data-r="${x.row}" onclick="pkChoose(this.dataset.r)">${imgTag(x,300)}</button>`).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--mut)">No photos yet${pkAll?'':' in this category. Try “All items”.'}</div>`)+(cur?`<button class="btn danger block" style="margin-top:18px" onclick="pkClear()">Remove custom picture (use automatic)</button>`:'')}
async function pkChoose(row){const it=byRow[row],c=catList()[pkIdx];if(!it||!c)return;const src=it.photo||baseUrl(it);if(!src)return;if(await cloudSet({catImg:{...(CFG.catImg||{}),[c.n]:src}}))closeOv('picker')}
async function pkClear(){const c=catList()[pkIdx];if(!c)return;const o={...(CFG.catImg||{})};delete o[c.n];if(await cloudSet({catImg:o}))closeOv('picker')}

let taps=[];$('logo').addEventListener('click',()=>{const n=Date.now();taps=taps.filter(t=>n-t<2500);taps.push(n);if(taps.length>=5){taps=[];askPin()}});
if(location.hash==='#admin')setTimeout(askPin,500);
parseBrands();parseRules();loadCache();renderStatic();renderAll();renderHero();applyTheme();paintAvatar();paintMusic();paintStatus();renderAshara();
['touchstart','click','scroll','keydown'].forEach(ev=>addEventListener(ev,()=>{const was=isIdle();lastTouch=Date.now();if(was&&!document.hidden)pull()},{passive:true}));
pull();setInterval(()=>{if(document.hidden)return;if(isIdle()&&Date.now()-sheetTs<58000)return;pull()},10000);setInterval(paintStatus,2000);setInterval(beat,90000);setInterval(()=>{if(window.rtPing)fbPing()},60000);setInterval(renderAshara,5000);
if(!profile)openProfile(true);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,signInAnonymously,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,getDoc,getDocFromServer,setDoc,updateDoc,deleteField,serverTimestamp,collection,onSnapshot,addDoc,deleteDoc,getDocs,query,where,orderBy,limit} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBVSMzGFbbSMzNcyD1IAVc-z4vzWBsPOTE",authDomain:"price-list-88d33.firebaseapp.com",projectId:"price-list-88d33",storageBucket:"price-list-88d33.firebasestorage.app",messagingSenderId:"135322631733",appId:"1:135322631733:web:8c82e337c04f714eaa3b7c"});
const auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});
onAuthStateChanged(auth,u=>{window.rtIsAdmin=!!(u&&!u.isAnonymous);if(window.rtAuthUi)window.rtAuthUi()});
auth.authStateReady().then(()=>{if(!auth.currentUser)signInAnonymously(auth).catch(e=>console.warn('Anonymous sign-in is off in Firebase',e))});
window.rtPing=()=>getDocFromServer(doc(db,'config','shop'));
let lastV={};
window.rtTick=async()=>{let n=null;try{const s=await getDocFromServer(doc(db,'presence','live'));lastV=(s.exists()&&s.data().v)||{};const now=Date.now();n=Object.values(lastV).filter(t=>typeof t==='number'&&now-t<150000).length}catch(e){if(e&&e.code==='permission-denied'){await getDocFromServer(doc(db,'config','shop'))}else throw e}return n};
window.rtBeat=async c=>{const ref=doc(db,'presence','live'),now=Date.now(),u={['v.'+c]:now};for(const k in lastV){if(k!==c&&now-lastV[k]>600000)u['v.'+k]=deleteField()}try{await updateDoc(ref,u)}catch(e){if(e&&e.code==='not-found')await setDoc(ref,{v:{[c]:now}});else throw e}};
window.rtWatchDoc=(c,i,cb)=>onSnapshot(doc(db,c,i),{includeMetadataChanges:true},x=>cb(x.exists()?x.data():{},x.metadata.fromCache),e=>{console.warn(e);cb(null,true,e)});
window.rtWatchCol=(c,cb)=>onSnapshot(collection(db,c),x=>cb(x.docs.map(d=>({id:d.id,...d.data()}))),e=>console.warn(e));
window.rtAdminSet=(c,i,d)=>setDoc(doc(db,c,i),d,{merge:true});
window.rtAdminAdd=(c,d)=>addDoc(collection(db,c),d);
window.rtAdminDel=(c,i)=>deleteDoc(doc(db,c,i));
window.rtAdminLogin=(e,p)=>signInWithEmailAndPassword(auth,e,p);
window.rtAdminOut=()=>signOut(auth).then(()=>signInAnonymously(auth));
window.rtSaveOrder=async o=>{const u=auth.currentUser;if(!u)throw new Error('not signed in');await setDoc(doc(db,'orders',o.id),{...o,uid:u.uid,status:'new',createdAt:serverTimestamp()});return 'ok'};
window.rtSaveProfile=async p=>{const u=auth.currentUser;if(!u)return;await setDoc(doc(db,'users',u.uid),{...p,updatedAt:serverTimestamp()},{merge:true})};
window.rtMyOrders=async()=>{const u=auth.currentUser;if(!u)return[];const x=await getDocs(query(collection(db,'orders'),where('uid','==',u.uid)));return x.docs.map(d=>d.data())};
window.rtRecentOrders=async()=>{const x=await getDocs(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(20)));return x.docs.map(d=>d.data())};
if(window.rtReady)window.rtReady();

</script>
