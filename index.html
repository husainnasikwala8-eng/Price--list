<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C8161D">
<title>Raj Traders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="image.png">
<link rel="apple-touch-icon" href="image.png">
<script>try{var t=localStorage.getItem('rt4_theme');document.documentElement.setAttribute('data-theme',t||'light')}catch(e){}</script>
<style>
:root{--bg:#F7F5F1;--sf:#fff;--ink:#1B2230;--mut:#6B7385;--line:#E8E4DC;--ac:#C8161D;--ac2:#E2483D;--on:#fff;--soft:color-mix(in srgb,var(--ac) 8%,#fff);--glow:rgba(200,22,29,.2);--r:18px;--shadow:0 8px 26px rgba(20,28,45,.08)}
[data-theme="dark"]{--bg:#0F1114;--sf:#1A1D22;--ink:#F2F3F5;--mut:#98A0AE;--line:#2A2E35;--ac:#E5393B;--ac2:#FF6B63;--soft:color-mix(in srgb,var(--ac) 16%,#1A1D22);--glow:rgba(229,57,59,.3);--shadow:0 8px 26px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Mukta','Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35;padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow-x:hidden}
body.ov{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink)}
img{display:block}
.serif{font-family:'Playfair Display',serif}
.hdr{position:sticky;top:0;z-index:50;height:58px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:var(--ac);color:var(--on);box-shadow:0 2px 14px rgba(0,0,0,.18)}
.logo{display:flex;flex-direction:column;line-height:1;cursor:pointer;user-select:none}
.logo b{font-family:'Playfair Display',serif;font-size:1.05rem;letter-spacing:.16em}
.logo small{font-size:.68rem;opacity:.85;margin-top:3px;letter-spacing:.06em}
.hdr-r{display:flex;align-items:center;gap:8px}
.pill{height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.2);color:var(--on);font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:6px}
.pill i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.6}
.pill.ok i{background:#7CFF9B;opacity:1;animation:pulse 1.8s infinite}.pill.part i{background:#FFD36B;opacity:1}.pill.off i{background:#fff;opacity:.5}
@keyframes pulse{50%{opacity:.35}}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);font-weight:700;color:var(--on)}
.offline{display:none;background:#1B2230;color:#fff;font-size:.8rem;text-align:center;padding:7px 12px}
main{max-width:640px;margin:0 auto}
.hero{position:relative;margin:14px 14px 0;border-radius:24px;overflow:hidden;aspect-ratio:4/5;max-height:60vh;background:#000;box-shadow:0 18px 40px var(--glow)}
.hero.compact{aspect-ratio:2.6/1}
.hero-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hero-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;position:relative;scroll-snap-align:center;overflow:hidden;background:#111}
.slide.img::before{content:'';position:absolute;inset:-24px;background:var(--u) center/cover;filter:blur(22px) brightness(.5)}
.slide img,.slide video{position:relative;width:100%;height:100%;display:block}
.slide img{object-fit:contain}.slide video{object-fit:cover}
.hero.compact .slide img{object-fit:cover}
.hero-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.hero-dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.5);transition:all .3s}.hero-dots i.on{width:20px;background:#fff}
.hero-music{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.hero-music svg{width:20px;height:20px}
.hero-greet{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;padding:6px 14px;border-radius:16px;font-size:.82rem;backdrop-filter:blur(8px);display:none;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-3px)}}
.sbar-wrap{position:sticky;top:58px;z-index:40;padding:14px 14px 8px;background:linear-gradient(var(--bg) 75%,transparent)}
.sbar{width:100%;height:52px;border-radius:26px;background:var(--sf);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;color:var(--mut);text-align:left}
.sbar svg{width:20px;height:20px;flex:none;color:var(--ac)}
.quick{display:flex;gap:10px;padding:4px 14px 0}
.quick a{flex:1;height:48px;border-radius:14px;background:var(--sf);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.88rem}
.quick svg{width:18px;height:18px;color:var(--ac)}
.sec{padding:34px 14px 0}
.sh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;padding:0 4px}
.sh small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);margin-bottom:4px}
.sh h2{font-family:'Playfair Display',serif;font-size:1.5rem;line-height:1.15}
.lnk{color:var(--ac);font-weight:700;font-size:.88rem;padding:6px 2px}
.cnt{color:var(--mut);font-size:.82rem;font-weight:600}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px}
.cat{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;font-size:.82rem;font-weight:600;line-height:1.2}
.cat .tile{width:100%;aspect-ratio:1/1;border-radius:20px;background:#fff;border:1.5px solid color-mix(in srgb,var(--ac) 30%,var(--line));overflow:hidden;display:flex;align-items:center;justify-content:center;transition:box-shadow .2s,border-color .2s}
.cat .tile img{width:100%;height:100%;object-fit:cover}
.cat.on .tile{border-color:var(--ac);box-shadow:0 0 0 4px var(--glow)}.cat.on{color:var(--ac)}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff,color-mix(in srgb,var(--ac) 9%,#efeae0))}
.ph svg{width:36%;height:36%;color:var(--ac);opacity:.75}
.season{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px 4px;height:38px;padding:0 16px;border-radius:19px;background:var(--soft);border:1px solid var(--ac);font-weight:700;font-size:.85rem;color:var(--ink)}
.season.on{background:var(--ac);color:var(--on)}
.brand-rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 4px 6px}
.brand-rail::-webkit-scrollbar{display:none}
.bcard{flex:none;width:132px;height:78px;border-radius:16px;background:#fff;border:1.5px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:.92rem;color:#1B2230;text-align:center;transition:all .2s}
.bcard img{max-width:100%;max-height:100%;object-fit:contain}
.bcard.on{border-color:var(--ac);box-shadow:0 0 0 4px var(--glow);color:var(--ac)}
.fpills{display:flex;flex-wrap:wrap;gap:8px;margin:0 4px 14px}
.fp{height:34px;padding:0 14px;border-radius:17px;background:var(--soft);border:1px solid var(--ac);font-size:.82rem;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.pbox{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden}
.pbox img{width:100%;height:100%;object-fit:contain}
.brandtag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:#1B2230;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:8px}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.nm{font-weight:600;font-size:.95rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.mt{font-size:.74rem;color:var(--mut)}
.prow{display:flex;align-items:center;justify-content:space-between;margin-top:auto;min-height:40px}
.price{font-family:'Playfair Display',serif;font-weight:700;font-size:1.18rem;color:var(--ac)}
.add{width:40px;height:40px;border-radius:50%;background:var(--ac);color:var(--on);font-size:1.5rem;line-height:1;box-shadow:0 6px 14px var(--glow)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--ac);font-weight:700;font-size:1.15rem}
.step b{min-width:24px;text-align:center}
.more{width:100%;height:50px;margin-top:16px;border-radius:25px;border:1.5px solid var(--ac);color:var(--ac);font-weight:700}
.showcase{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sc{background:var(--sf);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-align:left}
.sc .top{height:84px;background:#fff;display:flex;align-items:center;justify-content:center;padding:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#1B2230;font-size:1.02rem;border-bottom:1px solid var(--line)}
.sc .top img{max-width:100%;max-height:100%;object-fit:contain}
.sc .thumbs{display:flex;gap:2px;height:78px;background:#fff}
.sc .thumbs div{flex:1;overflow:hidden}.sc .thumbs img{width:100%;height:100%;object-fit:cover}
.sc .inf{padding:10px 14px 14px;font-size:.8rem;color:var(--mut)}
.foot{margin:44px 0 0;padding:34px 22px 26px;background:#1C2A44;color:#E8ECF5;border-radius:28px 28px 0 0}
.foot h3{font-family:'Playfair Display',serif;font-size:1.3rem;letter-spacing:.12em;margin-bottom:6px}
.foot p{font-size:.88rem;opacity:.8;line-height:1.6}
.foot a{color:#fff;text-decoration:none;font-weight:600}
.foot .fine{margin-top:18px;font-size:.72rem;opacity:.5}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 0 max(8px,env(safe-area-inset-bottom))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--mut);padding:4px 0}
.bnav button.on{color:var(--ac)}.bnav svg{width:23px;height:23px}
.cartbar{position:fixed;left:14px;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:55;height:52px;border-radius:26px;background:var(--ac);color:var(--on);font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 10px 26px var(--glow)}
.ovl{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column}
.ovl.on{display:flex}
.ovl-top{flex:none;height:58px;padding:0 14px;display:flex;align-items:center;gap:10px;background:var(--sf);border-bottom:1px solid var(--line)}
.ovl-top h3{flex:1;font-family:'Playfair Display',serif;font-size:1.15rem}
.ib{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:20px;height:20px}
.ovl-body{flex:1;overflow-y:auto;padding:18px 14px 40px;max-width:640px;width:100%;margin:0 auto}
#search .ovl-top{gap:8px}
#q{flex:1;height:42px;border:0;background:var(--soft);border-radius:21px;padding:0 18px;outline:0}
.srow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--sf);margin-bottom:10px;box-shadow:var(--shadow)}
.srow .th{width:58px;height:58px;border-radius:12px;overflow:hidden;background:#fff;flex:none}
.srow .th img{width:100%;height:100%;object-fit:contain}
.srow .tx{flex:1;min-width:0}.srow .tx b{display:block;font-weight:600;font-size:.95rem;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{height:36px;padding:0 16px;border-radius:18px;background:var(--sf);border:1px solid var(--line);font-size:.86rem;font-weight:600}
.lbl{font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:6px 4px 12px}
.pd-img{aspect-ratio:1/1;background:#fff;overflow:auto;display:flex;align-items:center;justify-content:center;cursor:zoom-in;margin:-18px -14px 0}
.pd-img img{width:100%;height:100%;object-fit:contain}
.pd-img.z{display:block;cursor:zoom-out}.pd-img.z img{width:260%;height:auto;max-width:none}
.pd-in{padding:22px 4px}
.pd-in h2{font-family:'Playfair Display',serif;font-size:1.5rem;line-height:1.25;margin:10px 0}
.pd-price{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;color:var(--ac);margin-bottom:20px}
.tag{display:inline-block;padding:4px 12px;border-radius:12px;background:var(--soft);font-size:.74rem;font-weight:700;margin-right:6px}
.btn{height:50px;border-radius:25px;padding:0 24px;font-weight:700;background:var(--ac);color:var(--on);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px var(--glow)}
.btn.line{background:none;color:var(--ac);border:1.5px solid var(--ac);box-shadow:none}
.btn.block{width:100%}.btn[disabled]{opacity:.5}
.btn.danger{background:none;color:#C0392B;border:1.5px solid #C0392B;box-shadow:none}
.panel{background:var(--sf);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.panel h4{font-size:1rem;margin-bottom:12px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;outline:0}
.fld textarea{height:auto;padding:12px 14px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ac)}
.hint{font-size:.78rem;color:var(--mut);margin-top:6px;line-height:1.4}
.err{color:#C0392B;font-size:.84rem;margin:8px 0}
.crow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border:0}
.crow .tx{flex:1;min-width:0;font-size:.92rem;font-weight:600}.crow .tx small{display:block;color:var(--mut);font-weight:400;font-size:.76rem}
.ocard{background:var(--sf);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.modal{position:fixed;inset:0;z-index:300;background:rgba(10,14,24,.55);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.mc{background:var(--sf);border-radius:24px;padding:24px;width:100%;max-width:380px;max-height:88vh;overflow-y:auto}
.mc h3{font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:6px}
.mc p{color:var(--mut);font-size:.88rem;margin-bottom:16px;line-height:1.45}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:8px 0 20px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ac)}.pin-dots i.f{background:var(--ac)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keys button{height:58px;border-radius:18px;background:var(--soft);font-size:1.4rem;font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;background:var(--sf);border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:38px;padding:0 18px;border-radius:19px;background:var(--soft);font-weight:700;font-size:.86rem;color:var(--mut)}
.tab.on{background:var(--ac);color:var(--on)}
.arow{display:flex;gap:12px;align-items:center;background:var(--sf);border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:var(--shadow)}
.arow .th{width:54px;height:54px;border-radius:12px;overflow:hidden;background:#fff;flex:none}.arow .th img{width:100%;height:100%;object-fit:contain}
.arow .tx{flex:1;min-width:0}.arow .tx b{display:block;font-size:.92rem;line-height:1.2}.arow .tx small{color:var(--mut);font-size:.74rem}
.sm{height:36px;padding:0 16px;border-radius:18px;border:1.5px solid var(--ac);color:var(--ac);font-weight:700;font-size:.82rem;flex:none}
.bad{display:inline-block;font-size:.64rem;font-weight:700;padding:2px 8px;border-radius:8px;background:#FFF1D6;color:#8A5A00;margin-left:6px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:120;height:56px;padding:0 24px;border-radius:28px;background:var(--ac);color:var(--on);font-weight:700;display:none;align-items:center;gap:8px;box-shadow:0 12px 28px var(--glow)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{border-radius:16px;border:2px solid var(--line);padding:12px 6px;text-align:center;font-size:.74rem;font-weight:600;background:var(--sf)}
.sw i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 6px}
.sw.on{border-color:var(--ac)}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .pv{width:92px;height:92px;border-radius:16px;background:#fff;overflow:hidden;border:1.5px solid var(--line);flex:none}.photo-pick .pv img{width:100%;height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:500;background:#1B2230;color:#fff;padding:12px 20px;border-radius:22px;font-size:.88rem;opacity:0;pointer-events:none;transition:all .3s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#ashara{position:fixed;inset:0;z-index:400;background:radial-gradient(circle at 50% 25%,color-mix(in srgb,var(--ac) 30%,#0C0C0E),#0C0C0E 72%);color:#F3EEE2;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
#ashara b{font-family:'Playfair Display',serif;letter-spacing:.3em;font-size:1.05rem;opacity:.85}
#ashara h2{font-family:'Playfair Display',serif;font-size:1.9rem;margin:18px 0 10px}
#ashara p{opacity:.8;max-width:320px;line-height:1.55;white-space:pre-line}
#ashara a{margin-top:36px;color:rgba(255,255,255,.3);font-size:.72rem}
.stories{padding:14px 14px 0}
.st-row{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}.st-row::-webkit-scrollbar{display:none}
.st{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.7rem;font-weight:600}
.st .ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--ac),var(--ac2),#ffb84d)}
.st.seen .ring{background:var(--line)}
.st .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.st small{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
#story{background:#000;z-index:140}
#stBars{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:4px;z-index:3}
#stBars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
#stBars i.d{background:#fff}
#stBars i.c::after{content:'';position:absolute;inset:0;background:#fff;transform-origin:left;animation:stfill 5s linear forwards}
@keyframes stfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#stImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#stCap{position:absolute;left:0;right:0;bottom:0;padding:50px 20px calc(28px + env(safe-area-inset-bottom));color:#fff;font-size:1.05rem;background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:2}
#story .hit{position:absolute;top:60px;bottom:90px;width:50%;z-index:2}#story .hit.l{left:0}#story .hit.r{right:0}
#story .x{position:absolute;top:calc(22px + env(safe-area-inset-top));right:12px;z-index:4;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:1.2rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

function isPureSizeToken(raw) {
      if (/\d/.test(raw)) return true;
      const units = ['mm','cm','m','inch','ft','kg','g','lit','ml','no','w','watt'];
      return units.includes(raw.toLowerCase().replace(/[^a-z]/g, ''));
    }

    function transliterateWord(rawWord) {
      const w = rawWord.toLowerCase();
      if (MARATHI_DICT[w]) return MARATHI_DICT[w];
      const consonants = [['kh','ख'],['gh','घ'],['chh','छ'],['ch','च'],['jh','झ'],['th','थ'],['dh','ध'],['ph','फ'],['bh','भ'],['sh','श'],['k','क'],['g','ग'],['j','ज'],['t','ट'],['d','ड'],['n','न'],['p','प'],['b','ब'],['m','म'],['y','य'],['r','र'],['l','ल'],['v','व'],['w','व'],['s','स'],['h','ह'],['f','फ'],['z','झ'],['c','क']];
      const vowelsIndep = [['aa','आ'],['ee','ई'],['oo','ऊ'],['ai','ऐ'],['au','औ'],['a','अ'],['i','इ'],['u','उ'],['e','ए'],['o','ओ']];
      const vowelsMatra = [['aa','ा'],['ee','ी'],['oo','ू'],['ai','ै'],['au','ौ'],['a',''],['i','ि'],['u','ु'],['e','े'],['o','ो']];
      let result = '', i = 0;
      while (i < w.length) {
        let matchedCons = null;
        for (const pair of consonants) if (w.startsWith(pair[0], i)) { matchedCons = pair; break; }
        if (matchedCons) {
          i += matchedCons[0].length;
          let matchedVowel = null;
          for (const pair of vowelsMatra) if (pair[0] && w.startsWith(pair[0], i)) { matchedVowel = pair; break; }
          if (matchedVowel) { result += matchedCons[1] + matchedVowel[1]; i += matchedVowel[0].length; }
          else { result += matchedCons[1]; }
        } else {
          let matchedVowel = null;
          for (const pair of vowelsIndep) if (w.startsWith(pair[0], i)) { matchedVowel = pair; break; }
          if (matchedVowel) { result += matchedVowel[1]; i += matchedVowel[0].length; }
          else { result += w[i]; i += 1; }
        }
      }
      return result.trim() === '' ? rawWord : result; 
    }

    function transliterateName(text) {
      if (!text) return "";
      const lowerFull = text.toLowerCase().trim();
      if (MARATHI_DICT[lowerFull]) return MARATHI_DICT[lowerFull];
      return text.split(/\s+/).map(tok => {
        if (isPureSizeToken(tok)) return tok;
        const match = tok.match(/^([^a-zA-Z0-9]*)([a-zA-Z0-9.-]+)([^a-zA-Z0-9]*)$/);
        let prefix = "", core = tok, suffix = "";
        if (match) { prefix = match[1]; core = match[2]; suffix = match[3]; }
        let cleanCore = core.toLowerCase().replace(/[^a-z]/g, '');
        if (!cleanCore) return tok; 
        return prefix + (MARATHI_DICT[cleanCore] || transliterateWord(cleanCore)) + suffix;
      }).join(' ');
    }

function lev(a,b,m){const la=a.length,lb=b.length;if(Math.abs(la-lb)>m)return m+1;let p=[];for(let j=0;j<=lb;j++)p[j]=j;for(let i=1;i<=la;i++){let c=[i],mn=i;for(let j=1;j<=lb;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));c[j]=v;if(v<mn)mn=v}if(mn>m)return m+1;p=c}return p[lb]}
function search(q,lim){
 const qt=sn(q).split(' ').filter(Boolean);if(!qt.length)return[];const out=[];
 const score=(it,strict)=>{let tot=0,hit=0;for(const t of qt){let best=0;for(const w of it._t){let s=0;if(w===t)s=4;else if(w.startsWith(t))s=3;else if(t.length>=3&&w.includes(t))s=2;else if(t.length>=4){const m=t.length>=7?2:1;if(lev(w.slice(0,t.length+1),t,m)<=m||lev(w,t,m)<=m)s=1.2}if(s>best){best=s;if(s===4)break}}if(best){hit++;tot+=best}else if(strict)return 0}
  if(!hit)return 0;if(it._n.startsWith(qt[0]))tot+=1;return tot-it._n.length*.002+(hit===qt.length?0:-2)};
 for(const it of items){const s=score(it,true);if(s>0)out.push([s,it])}
 if(out.length<4&&qt.length>1)for(const it of items){if(out.some(o=>o[1]===it))continue;const s=score(it,false);if(s>0)out.push([s,it])}
 out.sort((a,b)=>b[0]-a[0]);return out.slice(0,lim).map(x=>x[1])}

 $('dBody').innerHTML=`<div class="pd-img" onclick="this.classList.toggle('z')">${u?`<img src="${esc(u)}" alt="" data-k="${it.ik}" onerror="imgFail(this)">`:phHtml(it.ik)}</div><div class="pd-in"><span class="tag">${esc(catOf(it.category))}</span>${it.brand?`<span class="tag">${esc(it.brand)}</span>`:''}<h2>${esc(nameOf(it))}</h2><div class="pd-price">${p==null?T('Price on request','किंमत विचारा'):'₹'+fmt(p)}</div><span data-ctl="${it.row}" style="display:inline-block">${ctl(it)}</span><p class="hint" style="margin-top:18px">${T('Tap the photo to zoom. Prices are indicative; the shop confirms your order.','फोटो मोठा करण्यासाठी टॅप करा. किंमत अंदाजे; दुकान ऑर्डर निश्चित करेल.')}</p></div>${sim.length?`<div class="lbl">${T('More in this category','याच श्रेणीतील आणखी')}</div>`+sim.map(x=>{const q=priceOf(x);return`<div class="srow" onclick="openDetail(${x.row})"><div class="th">${imgTag(x,160)}</div><div class="tx"><b>${esc(nameOf(x))}</b><span class="mt">${q==null?'':'₹'+fmt(q)}</span></div><span data-ctl="${x.row}" onclick="event.stopPropagation()">${ctl(x)}</span></div>`}).join(''):''}`;
 openOv('detail');$('dBody').scrollTop=0}
/* ---------- orders / settings ---------- */
async function openOrders(){setNav('nOrd');openOv('orders');const b=$('oBody');b.innerHTML=`<div class="hint">…</div>`;let list=ls.g('rt4_orders',[]);
 try{if(window.rtMyOrders){const r=await Promise.race([rtMyOrders(),new Promise(x=>setTimeout(()=>x([]),2500))]);r.forEach(o=>{if(!list.some(x=>x.id===o.id))list.push({id:o.id,total:o.total,t:o.createdAt&&o.createdAt.toMillis?o.createdAt.toMillis():0,items:(o.items||[]).map(i=>({k:i.category+'||'+i.name,name:i.name,qty:i.qty,price:i.price}))})})}}catch(e){}
 list.sort((a,b)=>b.t-a.t);window._ol=list;
 b.innerHTML=list.length?list.map(o=>`<div class="ocard"><div style="display:flex;justify-content:space-between;font-weight:700"><span>${esc(o.id)}</span><span class="serif" style="color:var(--ac)">₹${fmt(o.total||0)}</span></div><div class="mt" style="margin:4px 0 10px">${o.t?new Date(o.t).toLocaleString('en-IN'):''} · ${(o.items||[]).length} ${T('items','वस्तू')}</div><div style="font-size:.86rem;margin-bottom:12px;line-height:1.6">${(o.items||[]).slice(0,4).map(i=>esc(i.name)+' × '+i.qty).join('<br>')}${(o.items||[]).length>4?'<br>…':''}</div><button class="btn line block" style="height:44px" data-id="${esc(o.id)}" onclick="reorder(this.dataset.id)">${T('Order again','पुन्हा ऑर्डर करा')}</button></div>`).join(''):`<div class="panel" style="text-align:center;color:var(--mut)">${T('No orders yet on this phone.','या फोनवर अजून ऑर्डर नाही.')}</div>`}
function reorder(id){const o=(window._ol||[]).find(x=>x.id===id);if(!o)return;let n=0;o.items.forEach(i=>{if(byKey[i.k]){cart[i.k]=(cart[i.k]||0)+i.qty;n++}});saveCart();renderAll();closeOv('orders');if(n)openCart();else toast(T('These items are no longer in the catalogue.','या वस्तू आता कॅटलॉगमध्ये नाहीत.'))}
function openSettings(){setNav('nSet');renderSettings();openOv('settings')}
function renderSettings(){const p=profile||{},dark=document.documentElement.getAttribute('data-theme')==='dark';
 $('stBody').innerHTML=`<div class="panel"><h4>${T('My details','माझे तपशील')}</h4><div style="line-height:1.7"><b>${esc(p.name||'')}</b><br>${esc(p.shop||'')}<br>${p.phone?'+91 '+esc(p.phone):''}</div><button class="btn line block" style="margin-top:14px;height:44px" onclick="openProfile(false)">${T('Edit my details','माझे तपशील बदला')}</button></div>
 <div class="panel"><h4>${T('Appearance','स्वरूप')}</h4><div style="display:flex;gap:10px"><button class="btn ${dark?'line':''}" style="flex:1;height:44px" onclick="setTheme('light')">${T('Light','लाईट')}</button><button class="btn ${dark?'':'line'}" style="flex:1;height:44px" onclick="setTheme('dark')">${T('Dark','डार्क')}</button></div><div style="display:flex;gap:10px;margin-top:10px"><button class="btn ${lang==='en'?'':'line'}" style="flex:1;height:44px" onclick="setLang('en')">English</button><button class="btn ${lang==='mr'?'':'line'}" style="flex:1;height:44px" onclick="setLang('mr')">मराठी</button></div></div>
 <div class="panel"><h4>${T('Contact the shop','दुकानाशी संपर्क')}</h4>${PHONES.map(x=>`<a class="crow" style="text-decoration:none;color:var(--ink)" href="tel:${x.length>10?'+91'+x.slice(1):'+91'+x}"><div class="tx">${x}<small>${T('Tap to call','कॉल करण्यासाठी टॅप करा')}</small></div></a>`).join('')}<div class="hint">Devi Chowk, Near Asha Restaurant, Nashik</div></div>
 ${window.installEv?`<button class="btn block" onclick="installApp()">${T('Install app','अॅप इन्स्टॉल करा')}</button>`:''}`}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);ls.s('rt4_theme',t);try{localStorage.setItem('rt4_theme',t)}catch(e){}renderSettings()}
function setLang(l){lang=l;ls.s('rt4_lang',l);renderStatic();renderAll();renderHero();applyTheme();renderSettings();if($('cart').classList.contains('on'))renderCart()}
const toggleLang=()=>setLang(lang==='mr'?'en':'mr');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.installEv=e});
const installApp=()=>{if(window.installEv){installEv.prompt();window.installEv=null;renderSettings()}};
/* ---------- theme, closure ---------- */
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
function applyTheme(){const id=CFG.theme||'default',t=THEMES[id]||THEMES.default,r=document.documentElement.style;
 if(id==='default'){['--ac','--ac2','--glow','--on'].forEach(k=>r.removeProperty(k))}else{r.setProperty('--ac',t.a);r.setProperty('--ac2',t.b);r.setProperty('--glow',hexA(t.a,.28));r.setProperty('--on',t.dk?'#1B1A17':'#fff')}
 const g=$('greet');g.style.display=id!=='default'?'block':'none';g.textContent=t.e+' '+t.g[lang==='mr'?1:0];renderCats()}
const isClosed=()=>CFG.closed&&(!CFG.untilMs||Date.now()<CFG.untilMs);
function renderAshara(){const show=isClosed()&&!isAdmin,o=$('ashara');o.style.display=show?'flex':'none';if(show){$('asT').textContent=CFG.ct||T('Closed for Ashara','अशरा निमित्त बंद');$('asM').textContent=(CFG.msg||T('Thank you for your understanding. We will be back soon.','आपल्या समजुतीबद्दल धन्यवाद. आम्ही लवकरच परत येऊ.'))+(CFG.until?'\n'+T('Back on ','पुन्हा सुरू: ')+CFG.until:'')}}
function onConfig(c,fromCache,err){if(err||c==null){fbReady=false;paintStatus();return}if(!fromCache){fbReady=true;fbTs=Date.now()}CFG=c;ls.s('rt4_cfg',c);parseBrands();parseRules();if(window.RAW)rebuild(window.RAW);applyTheme();renderAll();renderAshara();renderHero();paintStatus()}
function onAds(a){ads=a||[];ls.s('rt4_ads',ads);renderHero();if($('admin').classList.contains('on')&&admTab==='ads')renderAdmin()}
window.rtReady=function(){rtWatchDoc('config','shop',onConfig);rtWatchCol('ads',onAds);rtWatchCol('status',onStatus);fbPing()};
async function fbPing(){if(!window.rtPing)return;try{await rtPing();fbReady=true;fbTs=Date.now()}catch(e){fbReady=false}paintStatus()}
/* ---------- status pill ---------- */
function paintStatus(){const n=Date.now(),sh=sheetOK&&n-sheetTs<26000,fb=fbReady&&n-fbTs<95000,st=sh&&fb?'ok':(sh||fb)?'part':'off',p=$('syncPill');p.className='pill '+st;p.querySelector('span').textContent=st==='ok'?T('Live','लाइव्ह'):st==='part'?T('Partial','अंशतः'):T('Offline','ऑफलाइन');
 const o=$('offline');if(!sh&&items.length){o.style.display='block';o.textContent=T('Offline — showing prices saved at ','ऑफलाइन — जतन केलेले भाव: ')+(lastSheetAt?new Date(lastSheetAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'—')}else o.style.display='none';
 if($('admSync'))$('admSync').textContent=st==='ok'?'● Live':'● '+(st==='part'?'Partial':'Offline')}
function syncLines(){const n=Date.now(),sh=sheetOK&&n-sheetTs<26000,fb=fbReady&&n-fbTs<95000,t=x=>x?new Date(x).toLocaleTimeString('en-IN'):'—';return`${sh?'🟢':'🔴'} Google Sheet · ${sh?T('updated ','अपडेट: ')+t(sheetTs):T('not reachable (last ','पोहोचत नाही (शेवटचे ')+t(lastSheetAt)+')'}<br>${fb?'🟢':'🔴'} Firebase · ${fb?T('connected','जोडलेले'):T('not connected','जोडलेले नाही')}<br>📦 ${items.length} ${T('products','वस्तू')} · ${T('refresh every 10 s','दर १० सेकंदांनी अपडेट')}${window.rtIsAdmin?'<br>🔑 Admin cloud sign-in active':''}`}
function openSync(){$('syT').textContent=T('Connection status','कनेक्शन स्थिती');$('syBody').innerHTML=syncLines();openModal('sync')}

const Music={on:false,el:null,ctx:null,synth:false,CH:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],ci:0,
 f:m=>440*Math.pow(2,(m-69)/12),
 target(){return this.on&&heroVisible&&!document.hidden?1:0},
 start(){this.on=true;if(!this.el){const a=this.el=new Audio(CFG.musicUrl||'ad-music.mp3');a.loop=true;a.preload='auto';a.volume=0}
  const p=this.el.play();if(p&&p.catch)p.catch(()=>{if(this.on&&!this.synth){this.synth=true;this.startSynth()}});this.fade()},
 stop(){this.on=false;this.fade(true)},
 fade(final){const v=this.target()*.5;
  if(this.el){clearInterval(this.rt);this.rt=setInterval(()=>{const a=this.el,d=v-a.volume;if(Math.abs(d)<.03){a.volume=v;clearInterval(this.rt);if(v===0&&final)a.pause()}else a.volume=Math.max(0,Math.min(1,a.volume+Math.sign(d)*.03))},60)}
  if(this.ctx){this.master.gain.linearRampToValueAtTime(v*1.1,this.ctx.currentTime+1.4);if(v===0&&final)setTimeout(()=>clearInterval(this.tm),1600)}},
 startSynth(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  if(!this.ctx){const c=this.ctx=new C();this.master=c.createGain();this.master.gain.value=0;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1500;this.bus=c.createGain();this.bus.connect(fl);fl.connect(this.master);const d=c.createDelay(1);d.delayTime.value=.42;const fb=c.createGain();fb.gain.value=.38;const wet=c.createGain();wet.gain.value=.35;fl.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(this.master);this.master.connect(c.destination)}
  this.ctx.resume();this.nc=this.na=this.ctx.currentTime+.1;clearInterval(this.tm);this.tm=setInterval(()=>this.tick(),250);this.tick();this.fade()},
 tick(){const c=this.ctx,now=c.currentTime;while(this.nc<now+.8){const ch=this.CH[this.ci++%4];ch.forEach(m=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=this.f(m);g.gain.setValueAtTime(0,this.nc);g.gain.linearRampToValueAtTime(.055,this.nc+1.3);g.gain.linearRampToValueAtTime(0,this.nc+3.9);o.connect(g);g.connect(this.bus);o.start(this.nc);o.stop(this.nc+4)});this.nc+=3.6}
  while(this.na<now+.8){const ch=this.CH[(this.ci+3)%4],m=ch[Math.floor(Math.random()*3)]+12*(1+Math.floor(Math.random()*2)),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=this.f(m);g.gain.setValueAtTime(0,this.na);g.gain.linearRampToValueAtTime(.07,this.na+.02);g.gain.exponentialRampToValueAtTime(.0005,this.na+1.3);o.connect(g);g.connect(this.bus);o.start(this.na);o.stop(this.na+1.4);this.na+=.9}}};

let pinBuf='',pinBusy=false;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
function askPin(){if(stack.includes('admin'))return;const lk=ls.g('rt4_lock',0);if(Date.now()<lk){toast('Locked. Try again in '+Math.ceil((lk-Date.now())/60000)+' min');return}pinBuf='';paintPin();$('pinMsg').textContent='Enter PIN';openModal('pin')}
$('keys').innerHTML=['1','2','3','4','5','6','7','8','9','←','0','✕'].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('');
const paintPin=()=>{$('pinDots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')};
async function pinKey(k){if(pinBusy)return;if(k==='✕'){closeModal('pin');return}if(k==='←'){pinBuf=pinBuf.slice(0,-1);paintPin();return}if(pinBuf.length>=4)return;pinBuf+=k;paintPin();if(pinBuf.length<4)return;pinBusy=true;let ok=false;
 try{ok=(await sha('rtv1:'+pinBuf))===PIN_HASH}catch(e){$('pinMsg').textContent='Needs a secure (https) page';pinBuf='';paintPin();pinBusy=false;return}pinBusy=false;
 if(ok){ls.s('rt4_fail',0);isAdmin=true;closeModal('pin');renderAshara();openAdmin()}
 else{const f=ls.g('rt4_fail',0)+1;ls.s('rt4_fail',f);pinBuf='';paintPin();if(f>=5){ls.s('rt4_lock',Date.now()+300000);ls.s('rt4_fail',0);$('pinMsg').textContent='Too many tries. Locked for 5 minutes.';setTimeout(()=>closeModal('pin'),1500)}else $('pinMsg').textContent='Wrong PIN ('+(5-f)+' tries left)'}}

async function compress(file,max,q){let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
 const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,s=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);const dataUrl=c.toDataURL('image/jpeg',q);return{dataUrl,kb:Math.round(dataUrl.length*.75/1024),orig:Math.round(file.size/1024)}}

async function importAds(){if(!window.rtIsAdmin){toast('Sign in first');return}try{let o=1;for(const a of DEF_ADS)await rtAdminAdd('ads',{type:a.t,url:a.s,poster:a.p||'',title:'',order:o++,active:true});await cloudSet({adsInit:true})}catch(e){toast('Import failed')}}
async function adAct(op,id){if(!window.rtIsAdmin){toast('Sign in first');return}const L=[...ads].sort((a,b)=>(a.order||0)-(b.order||0)),i=L.findIndex(a=>a.id===id),a=L[i];if(!a)return;
 try{if(op==='del'){if(!confirm('Delete this ad?'))return;await rtAdminDel('ads',id)}else if(op==='tog')await rtAdminSet('ads',id,{active:a.active===false});else{const j=op==='up'?i-1:i+1;if(j<0||j>=L.length)return;const b=L[j];await rtAdminSet('ads',a.id,{order:b.order||j+1});await rtAdminSet('ads',b.id,{order:a.order||i+1})}}catch(e){toast('Could not update')}}
async function addPhotoAd(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(!window.rtIsAdmin){toast('Sign in first');return}try{const c=await compress(f,1280,.82);toast(`Converted ${c.orig} KB → ${c.kb} KB. Uploading…`);const d=await uploadAsset(c.dataUrl,'ad');const mx=Math.max(0,...ads.map(a=>a.order||0));await rtAdminAdd('ads',{type:'image',url:d.url,title:'',order:mx+1,active:true});toast('Ad added')}catch(e){toast(e.message||'Upload failed')}}
async function addVideoAd(){const u=$('adV').value.trim();if(!u){toast('Type the video file name or link');return}if(!window.rtIsAdmin){toast('Sign in first');return}try{const mx=Math.max(0,...ads.map(a=>a.order||0));await rtAdminAdd('ads',{type:'video',url:u,poster:'',title:$('adC').value.trim(),order:mx+1,active:true});toast('Video added')}catch(e){toast('Could not add')}}
/* ---------- brands ---------- */
function admBrands(){if(!brDraft)brDraft=(CFG.brandList&&CFG.brandList.length?CFG.brandList:DEF_BRANDS).map(b=>({n:b.n,a:b.a||'',l:b.l||''}));
 return cloudGate()+`<div class="hint" style="margin:0 4px 14px">Brands are matched from item names, using the name or any other spelling. They appear in “Top brands” and “Brands we sell”.</div>`+brDraft.map((b,i)=>`<div class="panel"><div class="photo-pick"><div class="pv" style="width:72px;height:72px">${b.l?`<img src="${esc(b.l)}" alt="">`:phHtml('box')}</div><div style="flex:1"><div class="fld" style="margin-bottom:8px"><input value="${esc(b.n)}" placeholder="Brand name" oninput="brDraft[${i}].n=this.value"></div><div class="fld" style="margin:0"><input value="${esc(b.a)}" placeholder="Other spellings, comma separated" oninput="brDraft[${i}].a=this.value"></div></div></div><div style="display:flex;gap:10px;margin-top:12px"><label class="btn line" style="flex:1;height:42px">${b.l?'Change logo':'Upload logo'}<input type="file" accept="image/*" hidden onchange="pickLogo(${i},this)"></label><button class="btn danger" style="height:42px" onclick="brDraft.splice(${i},1);renderAdmin()">Remove</button></div></div>`).join('')+`<button class="btn line block" onclick="brDraft.push({n:'',a:'',l:''});renderAdmin()">＋ Add brand</button><button class="btn block" style="margin-top:12px" onclick="saveBrands()">Save brands</button>`}
async function pickLogo(i,inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;try{const c=await compress(f,500,.85);toast(`Converted ${c.orig} KB → ${c.kb} KB. Uploading…`);const d=await uploadAsset(c.dataUrl,'logo');brDraft[i].l=d.url;renderAdmin()}catch(e){toast(e.message||'Upload failed')}}
async function saveBrands(){const L=brDraft.map(b=>({n:b.n.trim(),a:b.a.trim(),l:b.l||''})).filter(b=>b.n);if(await cloudSet({brandList:L}))brDraft=null}
/* ---------- look & ashara ---------- */
function admLook(){if(!lkDraft)lkDraft={theme:CFG.theme||'default',kw:CFG.kw||'',closed:!!CFG.closed,ct:CFG.ct||'',msg:CFG.msg||'',until:CFG.until||''};
 return cloudGate()+`<div class="panel"><h4>Theme</h4><div class="swatches">${Object.keys(THEMES).map(k=>`<button class="sw ${lkDraft.theme===k?'on':''}" onclick="lkDraft.theme='${k}';renderAdmin()"><i style="background:${THEMES[k].a}"></i>${THEMES[k].e} ${THEMES[k].n}</button>`).join('')}</div><div class="fld" style="margin-top:16px"><label>Seasonal picks keywords (blank = theme default)</label><input value="${esc(lkDraft.kw)}" oninput="lkDraft.kw=this.value" placeholder="paint, brush, roller"></div></div>
 <div class="panel"><h4>Ashara mode</h4><div class="crow"><div class="tx">Close the app for everyone<small>Locks every link and the installed app while online. Customers see your message.</small></div><button class="sm" onclick="lkDraft.closed=!lkDraft.closed;renderAdmin()">${lkDraft.closed?'ON':'Off'}</button></div><div class="fld" style="margin-top:14px"><label>Heading</label><input value="${esc(lkDraft.ct)}" oninput="lkDraft.ct=this.value" placeholder="Closed for Ashara"></div><div class="fld"><label>Message</label><textarea rows="3" oninput="lkDraft.msg=this.value">${esc(lkDraft.msg)}</textarea></div><div class="fld" style="margin:0"><label>Reopens on (unlocks by itself after this date)</label><input type="date" value="${esc(lkDraft.until)}" oninput="lkDraft.until=this.value"></div></div><button class="btn block" onclick="saveLook()">Save look and Ashara mode</button>`}
async function saveLook(){const d=lkDraft,u=d.until;if(await cloudSet({theme:d.theme,kw:d.kw.trim(),closed:d.closed,ct:d.ct.trim(),msg:d.msg.trim(),until:u,untilMs:u?new Date(u+'T23:59:59').getTime():0}))lkDraft=null}
/* ---------- tools ---------- */
function admTools(){return`<div class="panel"><h4>Connections</h4><div style="font-size:.92rem;line-height:1.9">${syncLines()}</div>${window.rtIsAdmin?`<button class="btn line block" style="margin-top:12px;height:44px" onclick="rtAdminOut()">Sign out of cloud admin</button>`:''}</div>${cloudGate()}
 <div class="panel"><h4>Photo service</h4><div class="fld"><label>Web app URL</label><input id="tPapi" value="${esc(photoApi())}" placeholder="https://script.google.com/macros/s/…/exec"></div><div style="display:flex;gap:10px"><button class="btn line" style="flex:1;height:44px" onclick="testPapi()">Test</button><button class="btn" style="flex:1;height:44px" onclick="savePapi()">Save</button></div><div class="hint" id="tPh">Saves photos to Google Drive and writes the link into your Sheet's Photo column. Setup steps are inside the photo-service file.</div></div>
 <div class="panel"><h4>Base photos</h4><div class="fld"><label>Rules: words => image file (one per line)</label><textarea id="tRules" rows="7">${esc(CFG.rules||BASE_RULES_DEF)}</textarea></div><button class="btn block" style="height:44px" onclick="cloudSet({rules:$('tRules').value.trim()})">Save rules</button><div class="hint">Used only for items with no photo in the Sheet. A real photo always replaces it.</div></div>
 <div class="panel"><h4>Catalogue health</h4><div id="hlth" class="hint">Check for duplicates, doubled categories and blank prices.</div><div style="display:flex;gap:10px;margin-top:12px"><button class="btn line" style="flex:1;height:44px" onclick="diag()">Check</button><button class="btn danger" style="flex:1;height:44px" onclick="dedupe()">Clean duplicates</button></div></div>
 <div class="panel"><h4>Recent orders</h4><div id="ords" class="hint">${window.rtIsAdmin?'Loading…':'Sign in above to see orders.'}</div></div>`}
async function loadOrders(){try{const r=await rtRecentOrders();$('ords').innerHTML=r.length?r.map(o=>`<div class="crow"><div class="tx">${esc((o.customer&&o.customer.company)||'')} · ${esc((o.customer&&o.customer.name)||'')}<small>${esc(o.id)} · ${(o.items||[]).length} items · ₹${fmt(o.total||0)}${o.createdAt&&o.createdAt.toMillis?' · '+new Date(o.createdAt.toMillis()).toLocaleString('en-IN'):''}</small></div></div>`).join(''):'No orders yet.'}catch(e){$('ords').textContent='Could not load orders.'}}
function savePapi(){const v=$('tPapi').value.trim();ls.s('rt4_papi',v);CFG.photoApi=v;if(window.rtIsAdmin)cloudSet({photoApi:v});else toast('Saved on this phone')}
async function testPapi(){const v=$('tPapi').value.trim(),h=$('tPh');if(!v){h.textContent='Paste the web app URL first.';return}h.textContent='Testing…';try{const d=await (await fetch(v)).json();h.textContent=d&&d.service==='photo'?'Connected. Photo uploads will work.':'The URL answered, but it is not the photo service.'}catch(e){h.textContent='Could not reach that URL. Check it is deployed for “Anyone”.'}}
async function diag(){const h=$('hlth');h.textContent='Checking…';try{const r=await post({action:'diagnose'});if(r.status==='ok'&&r.counts){const c=r.counts;h.innerHTML=`Duplicate groups: <b>${c.duplicateGroups||0}</b><br>Doubled category names: <b>${c.doubledCategory||0}</b><br>Items without a category: <b>${c.generalOrphans||0}</b><br>Blank prices: <b>${c.blankPrice||0}</b>`}else h.textContent=r.message||'Unexpected answer from the Sheet.'}catch(e){h.textContent='Could not reach the Sheet.'}}
async function dedupe(){if(!confirm('Merge duplicate items? Extra copies are removed from the Sheet; the first copy keeps any price, photo or Marathi name the others had.'))return;try{const r=await post({action:'dedupe',confirm:true});if(r.status==='ok'){toast(`Merged ${r.merged||0} groups, removed ${r.removed||0} rows`);await pull();renderAdmin()}else toast(r.message||'Could not clean up')}catch(e){toast('Could not reach the Sheet')}}

async function addStatus(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(!window.rtIsAdmin){toast('Sign in first');return}try{const c=await compress(f,1280,.82);toast(`Converted ${c.orig} KB → ${c.kb} KB. Posting…`);const d=await uploadAsset(c.dataUrl,'status');await rtAdminAdd('status',{url:d.url,caption:($('stCapIn')||{value:''}).value.trim(),createdAt:Date.now()});toast('Status posted')}catch(x){toast(x.message||'Could not post')}}
async function delStatus(id){if(!window.rtIsAdmin||!confirm('Delete this status?'))return;try{await rtAdminDel('status',id)}catch(x){toast('Could not delete')}}

let taps=[];$('logo').addEventListener('click',()=>{const n=Date.now();taps=taps.filter(t=>n-t<2500);taps.push(n);if(taps.length>=5){taps=[];askPin()}});
if(location.hash==='#admin')setTimeout(askPin,500);
parseBrands();parseRules();loadCache();renderStatic();renderAll();renderHero();applyTheme();paintAvatar();paintMusic();paintStatus();renderAshara();renderStories();
pull();setInterval(()=>{if(!document.hidden)pull()},10000);setInterval(paintStatus,2000);setInterval(()=>{if(window.rtPing)fbPing()},60000);setInterval(renderAshara,5000);
if(!profile)openProfile(true);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,signInAnonymously,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,getDoc,getDocFromServer,setDoc,serverTimestamp,collection,onSnapshot,addDoc,deleteDoc,getDocs,query,where,orderBy,limit} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBVSMzGFbbSMzNcyD1IAVc-z4vzWBsPOTE",authDomain:"price-list-88d33.firebaseapp.com",projectId:"price-list-88d33",storageBucket:"price-list-88d33.firebasestorage.app",messagingSenderId:"135322631733",appId:"1:135322631733:web:8c82e337c04f714eaa3b7c"});
const auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});
onAuthStateChanged(auth,u=>{window.rtIsAdmin=!!(u&&!u.isAnonymous);if(window.rtAuthUi)window.rtAuthUi()});
auth.authStateReady().then(()=>{if(!auth.currentUser)signInAnonymously(auth).catch(e=>console.warn('Anonymous sign-in is off in Firebase',e))});
window.rtPing=()=>getDocFromServer(doc(db,'config','shop'));
window.rtWatchDoc=(c,i,cb)=>onSnapshot(doc(db,c,i),{includeMetadataChanges:true},x=>cb(x.exists()?x.data():{},x.metadata.fromCache),e=>{console.warn(e);cb(null,true,e)});
window.rtWatchCol=(c,cb)=>onSnapshot(collection(db,c),x=>cb(x.docs.map(d=>({id:d.id,...d.data()}))),e=>console.warn(e));
window.rtAdminSet=(c,i,d)=>setDoc(doc(db,c,i),d,{merge:true});
window.rtAdminAdd=(c,d)=>addDoc(collection(db,c),d);
window.rtAdminDel=(c,i)=>deleteDoc(doc(db,c,i));
window.rtAdminLogin=(e,p)=>signInWithEmailAndPassword(auth,e,p);
window.rtAdminOut=()=>signOut(auth).then(()=>signInAnonymously(auth));
window.rtSaveOrder=async o=>{const u=auth.currentUser;if(!u)throw new Error('not signed in');await setDoc(doc(db,'orders',o.id),{...o,uid:u.uid,status:'new',createdAt:serverTimestamp()});return 'ok'};
window.rtSaveProfile=async p=>{const u=auth.currentUser;if(!u)return;await setDoc(doc(db,'users',u.uid),{...p,updatedAt:serverTimestamp()},{merge:true})};
window.rtMyOrders=async()=>{const u=auth.currentUser;if(!u)return[];const x=await getDocs(query(collection(db,'orders'),where('uid','==',u.uid)));return x.docs.map(d=>d.data())};
window.rtRecentOrders=async()=>{const x=await getDocs(query(collection(db,'orders'),orderBy('createdAt','desc'),limit(20)));return x.docs.map(d=>d.data())};
if(window.rtReady)window.rtReady();

</script>
