<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Raj Traders</title>
  <meta name="theme-color" content="#1a5fb4">
  <style>
    :root { --primary: #1a5fb4; --bg: #f4f4f9; --card-bg: #ffffff; --text: #222222; --subtext: #666666; --success: #28a745; --border: #e0e0e0; --danger: #dc3545; }
    body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; padding: 15px; max-width: 500px; margin: 0 auto; background-color: var(--bg); color: var(--text); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h2 { margin: 0; font-size: 22px; font-weight: 700; color: var(--primary); }
    .sync-btn { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-weight: 600; color: var(--subtext); cursor: pointer; }

    /* Language Toggle */
    .lang-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .lang-btn { background: var(--card-bg); border: 1px solid var(--primary); color: var(--primary); border-radius: 20px; padding: 6px 16px; font-weight: 700; font-size: 14px; cursor: pointer; }

    .category-bar { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 8px; margin-bottom: 12px; white-space: nowrap; }
    .category-bar::-webkit-scrollbar { display: none; }
    .cat-btn { background: #e5e5ea; padding: 8px 16px; border-radius: 20px; border: none; font-weight: 600; cursor: pointer; }
    .cat-btn.active { background: var(--primary); color: #fff; }
    
    /* Search Bar */
    .search-input { width: 100%; padding: 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; margin-bottom: 15px; }
    
    /* Item Cards */
    .item-card { background: var(--card-bg); padding: 14px 16px; margin-bottom: 8px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    .item-thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; margin-right: 12px; flex-shrink: 0; background: #eee; }
    .item-info { display: flex; flex-direction: column; }
    .item-name { font-size: 16px; font-weight: 600; color: var(--text); }
    .item-cat { font-size: 12px; color: var(--subtext); margin-top: 4px; }
    .item-price { font-size: 18px; font-weight: 700; color: var(--success); }
    
    /* Admin Actions (Hidden by default) */
    .admin-actions { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); justify-content: flex-end; gap: 10px; width: 100%; }
    .edit-mode .admin-actions { display: flex; }
    .item-wrapper { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }
    .action-btn { padding: 6px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
    .btn-edit { background: #e0f0ff; color: var(--primary); }
    .btn-del { background: #ffe0e0; color: var(--danger); }
    
    /* Admin Add Item Panel */
    .admin-panel { display: none; background: var(--card-bg); padding: 20px; margin-top: 30px; border-radius: 12px; border-top: 4px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .admin-input, .admin-select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    .admin-save-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    
    /* Secret Lock Trigger */
    .secret-lock { text-align: center; margin-top: 40px; font-size: 22px; opacity: 0.15; padding: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Raj Traders</h2>
    <span class="sync-btn" id="syncStatus" onclick="backgroundSync()">🟢 Ready</span>
  </div>

  <div class="lang-row">
    <button id="langToggle" class="lang-btn" onclick="toggleLanguage()">मराठी</button>
  </div>
  
  <div class="category-bar" id="categoryBar"></div>
  
  <!-- Instant Search Bar -->
  <input type="text" id="searchBar" class="search-input" placeholder="🔍 Search items instantly..." oninput="displayItems()">
  
  <div id="resultsList"></div>

  <!-- Admin Panel for Adding Items -->
  <div class="admin-panel" id="adminPanel">
    <h3>Add New Item</h3>
    <select id="adminCategorySelect" class="admin-select" onchange="handleAdminCategoryChange()"></select>
    <div id="newCategoryWrapper" style="display:none;">
      <input type="text" id="newCategoryInput" class="admin-input" placeholder="Type New Category Name">
    </div>
    <input type="text" id="itemName" class="admin-input" placeholder="Item Name (e.g. Brass Tap)">
    <input type="number" id="itemPrice" class="admin-input" placeholder="Price (₹)">
    <button class="admin-save-btn" onclick="saveNewItem()">Save to Shop</button>
  </div>

  <div class="secret-lock" onclick="toggleAdmin()">🔒</div>

  <script>
    // The Active Google Script URL
    const API_URL = "https://script.google.com/macros/s/AKfycbwvQzcRgg10_EWOaJD49VQisYhpH9fG5jhqdAN2hPPZPFMDBMV1u9NH12W1kjo9PQM0/exec";
    const ADMIN_PIN = "1234";

    let items = [];            // normalized array: {key, category, name, price, marathi, photo, _marathiName}
    let itemsByKey = {};       // key -> item, for O(1) edit/delete lookups
    let categoryMarathiCache = {};
    let currentCategory = 'All';
    let uniqueCategories = new Set();
    let isAdmin = false;
    let currentLang = localStorage.getItem('raj_traders_lang') || 'en';

    // ---------- Marathi transliteration ----------
    // Curated dictionary of common shop / hardware terms -> decent Marathi words.
    // Anything not listed here falls back to phonetic transliteration below,
    // so a word is never dropped or left blank.
    const MARATHI_DICT = {
      "plumbing":"प्लंबिंग","paints":"पेंट","paint":"पेंट","fasteners":"फास्टनर्स","fastener":"फास्टनर",
      "construction":"बांधकाम साहित्य","chain":"साखळी","locks":"कुलूप","lock":"कुलूप",
      "gardening":"बागकाम","garden":"बाग","power":"पॉवर","tools":"टूल्स","tool":"टूल",
      "electric":"इलेक्ट्रिक","material":"साहित्य","general":"सर्वसाधारण",
      "ball":"बॉल","valve":"व्हॉल्व्ह","hose":"होज","clip":"क्लिप","joint":"जॉइंट",
      "nitro":"नायट्रो","bibcock":"बिबकॉक","long":"लांब","body":"बॉडी","tap":"टॅप",
      "pillar":"पिलर","angle":"अँगल","swan":"स्वान","sink":"सिंक","orega":"ओरेगा",
      "concealed":"कनसील्ड","mixer":"मिक्सर","pipe":"पाईप","wrench":"पाना",
      "mani":"मणी","pana":"पाना","brush":"ब्रश","roller":"रोलर","thinner":"थिनर",
      "tie":"टाय","light":"लाइट","heavy":"हेवी","thapi":"थापी","bhopali":"भोपाळी",
      "naila":"नायला","fesher":"फेशर","patra":"पत्रा","pop":"पीओपी","bottle":"बाटली",
      "gurmala":"गुरमाळा","khadi":"खाडी","panja":"पंजा","scissor":"कात्री","kaichi":"कैची",
      "pruner":"प्रूनर","flower":"फूल","cutter":"कटर","bolt":"बोल्ट","tin":"पत्रा",
      "hammer":"हातोडी","centering":"सेंटरिंग","silver":"सिल्व्हर","yellow":"पिवळा",
      "blue":"निळा","cross":"क्रॉस","pin":"पिन","round":"गोल","chinni":"छिन्नी",
      "flat":"सपाट","volamba":"ओळंबा","dog":"कुत्रा","disco":"डिस्को","knotted":"गाठ",
      "belt":"पट्टा","single":"सिंगल","double":"डबल","tube":"ट्यूब","laccha":"लच्छा",
      "secure":"सिक्युर","rapid":"रॅपिड","classic":"क्लासिक","vespa":"व्हेस्पा",
      "shield":"शील्ड","gold":"गोल्ड","sekal":"सेकल","shutter":"शटर","ss":"एसएस",
      "combo":"कॉम्बो","hecto":"हेक्टो","atut":"अतूट","navtal":"नवतल","abro":"अॅब्रो",
      "berger":"बर्जर","bamboo":"बांबू","tar":"डांबर","wooden":"लाकडी","line":"लाईन",
      "scrapper":"स्क्रॅपर","favda":"फावडा","kudal":"कुदळ","unicorn":"युनिकॉर्न",
      "hypermax":"हायपरमॅक्स","rotary":"रोटरी","drill":"ड्रिल","machine":"मशीन",
      "hot":"हॉट","gun":"गन","amber":"अंबर","putty":"पुट्टी","vibrator":"व्हायब्रेटर",
      "needle":"सुई","cord":"कॉर्ड","less":"लेस","cordless":"कॉर्डलेस","battery":"बॅटरी","charger":"चार्जर",
      "bit":"बिट","blower":"ब्लोअर","vacuum":"व्हॅक्यूम","segment":"सेगमेंट","rim":"रिम",
      "turbo":"टर्बो","zero":"झिरो","chipping":"चिपिंग","blade":"ब्लेड","freeman":"फ्रीमन",
      "moulding":"मोल्डिंग","wood":"लाकूड","super":"सुपर","cup":"कप","wheel":"चाक",
      "grinding":"ग्राइंडिंग","grinder":"ग्राइंडर","silicon":"सिलिकॉन","white":"पांढरा",
      "black":"काळा","clear":"क्लिअर","greece":"ग्रीस","grease":"ग्रीस","spray":"स्प्रे",
      "allied":"अलाइड","sieko":"सिको","seiko":"सिको","water":"वॉटर","primer":"प्रायमर",
      "red":"लाल","oxide":"ऑक्साईड","glossy":"ग्लॉसी","matt":"मॅट","orange":"ऑरेंज",
      "zink":"झिंक","zinc":"झिंक","waterproofing":"वॉटरप्रूफिंग","chemical":"केमिकल",
      "tester":"टेस्टर","wonder":"वंडर","tape":"टेप","wire":"वायर","stripper":"स्ट्रिपर",
      "measuring":"मापन","steel":"स्टील","fabrication":"फॅब्रिकेशन","petrol":"पेट्रोल",
      "saw":"सॉ","demolition":"डिमोलिशन","victor":"व्हिक्टर","royal":"रॉयल","mk":"एमके",
      "am":"एएम","four":"फोर","car":"कार","washer":"वॉशर","with":"सह","and":"आणि"
    };

    // Very small phonetic fallback so an unlisted word still becomes readable
    // Devanagari instead of being skipped. Not perfect, but decent for shop terms.
    function transliterateWord(rawWord) {
      const w = rawWord.toLowerCase();
      const consonants = [
        ['kh','ख'],['gh','घ'],['chh','छ'],['ch','च'],['jh','झ'],['ny','ञ'],
        ['th','थ'],['dh','ध'],['ph','फ'],['bh','भ'],['sh','श'],['ng','ङ'],
        ['k','क'],['g','ग'],['j','ज'],['t','ट'],['d','ड'],['n','न'],
        ['p','प'],['b','ब'],['m','म'],['y','य'],['r','र'],['l','ल'],
        ['v','व'],['w','व'],['s','स'],['h','ह'],['f','फ'],['x','क्स'],['z','झ'],['c','क']
      ];
      const vowelsIndep = [['aa','आ'],['ee','ई'],['oo','ऊ'],['ai','ऐ'],['au','औ'],
        ['a','अ'],['i','इ'],['u','उ'],['e','ए'],['o','ओ']];
      const vowelsMatra = [['aa','ा'],['ee','ी'],['oo','ू'],['ai','ै'],['au','ौ'],
        ['a',''],['i','ि'],['u','ु'],['e','े'],['o','ो']];

      let result = '';
      let i = 0;
      while (i < w.length) {
        let matchedCons = null;
        for (const pair of consonants) {
          if (w.startsWith(pair[0], i)) { matchedCons = pair; break; }
        }
        if (matchedCons) {
          i += matchedCons[0].length;
          let matchedVowel = null;
          for (const pair of vowelsMatra) {
            if (pair[0] && w.startsWith(pair[0], i)) { matchedVowel = pair; break; }
          }
          if (matchedVowel) {
            result += matchedCons[1] + matchedVowel[1];
            i += matchedVowel[0].length;
          } else {
            result += matchedCons[1];
          }
        } else {
          let matchedVowel = null;
          for (const pair of vowelsIndep) {
            if (w.startsWith(pair[0], i)) { matchedVowel = pair; break; }
          }
          if (matchedVowel) {
            result += matchedVowel[1];
            i += matchedVowel[0].length;
          } else {
            result += w[i];
            i += 1;
          }
        }
      }
      return result;
    }

    const UNIT_WORDS = new Set(['mm','cm','mtr','m','ft','kg','gm','g','lit','l','ml','no','lb','w','watt','watts']);

    function isPureSizeToken(raw) {
      const stripped = raw.replace(/[(),]/g, '');
      if (/\d/.test(stripped)) return true;
      return UNIT_WORDS.has(stripped.toLowerCase());
    }

    function translateWord(word) {
      const clean = word.toLowerCase().replace(/[^a-z]/g, '');
      if (!clean) return word;
      if (MARATHI_DICT[clean]) return MARATHI_DICT[clean];
      return transliterateWord(clean);
    }

    // Translates a full name/category word-by-word, leaving any token that
    // looks like a size, quantity, or unit completely untouched.
    function transliterateName(text) {
      if (!text) return text;
      return text.split(' ').map(tok => {
        if (!tok) return tok;
        if (isPureSizeToken(tok)) return tok;
        const m = tok.match(/^([^\w]*)([\w.-]*)([^\w]*)$/);
        if (!m || !m[2]) return tok;
        return m[1] + translateWord(m[2]) + m[3];
      }).join(' ');
    }

    // Safety net: if a manually-typed Marathi name is missing a size/number
    // that appears in the English name, append it rather than lose it.
    function ensureSizePreserved(marathiText, englishName) {
      const sizeTokens = englishName.split(' ').filter(isPureSizeToken);
      const missing = sizeTokens.filter(t => !marathiText.includes(t));
      return missing.length ? (marathiText.trim() + ' ' + missing.join(' ')) : marathiText;
    }

    function computeMarathiFields() {
      const catCache = {};
      items.forEach(item => {
        item._marathiName = item.marathi
          ? ensureSizePreserved(item.marathi, item.name)
          : transliterateName(item.name);
        if (!catCache[item.category]) {
          catCache[item.category] = transliterateName(item.category);
        }
      });
      categoryMarathiCache = catCache;
    }

    // ---------- Data normalization (accepts old flat-map API AND new column API) ----------
    function cleanCategory(catStr) {
      if (!catStr) return 'General';
      let clean = catStr.toString().trim();
      return clean.charAt(0).toUpperCase() + clean.slice(1).toLowerCase();
    }

    function normalizeRawItem(raw) {
      if (typeof raw !== 'object' || raw === null) return null;
      const get = (...keys) => {
        for (const k of keys) { if (raw[k] !== undefined && raw[k] !== null && raw[k] !== '') return raw[k]; }
        return '';
      };
      const fullKey = get('key', 'ITEM NAME', 'Item Name', 'itemName', 'name', 'Name');
      if (!fullKey) return null;

      let category = get('category', 'Category');
      let name = get('name', 'Name');
      if ((!category || !name) && fullKey.toString().includes(':')) {
        const parts = fullKey.toString().split(':');
        category = category || parts[0].trim();
        name = name || parts.slice(1).join(':').trim();
      }
      if (!category) category = 'General';
      if (!name) name = fullKey;

      const price = get('price', 'PRICE', 'Price');
      const marathi = get('marathi', 'Name (Marathi)', 'Marathi', 'marathiName');
      const photo = get('photo', 'Photo link', 'Photo Link', 'photoUrl', 'Photo');

      return {
        key: fullKey.toString(),
        category: cleanCategory(category),
        name: name.toString(),
        price: price,
        marathi: marathi ? marathi.toString().trim() : '',
        photo: photo ? photo.toString().trim() : ''
      };
    }

    function normalizeInventory(data) {
      let rawList = [];
      if (Array.isArray(data)) {
        rawList = data;
      } else if (typeof data === 'object' && data !== null) {
        // Legacy flat map format: { "Category: Name": price }
        rawList = Object.keys(data).map(k => ({ key: k, price: data[k] }));
      }
      return rawList.map(normalizeRawItem).filter(Boolean);
    }

    function applyItems(newItems) {
      items = newItems;
      itemsByKey = {};
      items.forEach(it => { itemsByKey[it.key] = it; });
      computeMarathiFields();
    }

    function persistCache() {
      try { localStorage.setItem('raj_traders_fast_cache', JSON.stringify(items)); } catch (e) {}
    }

    function init() {
      updateLangUI();
      const cached = localStorage.getItem('raj_traders_fast_cache');
      if (cached) {
        try {
          applyItems(normalizeInventory(JSON.parse(cached)));
          buildCategories();
          displayItems();
        } catch (e) {
          localStorage.removeItem('raj_traders_fast_cache');
        }
      }
      backgroundSync();
    }

    async function backgroundSync() {
      const status = document.getElementById('syncStatus');
      if (status) status.innerText = "🔄 Syncing...";
      try {
        const response = await fetch(API_URL);
        const raw = await response.json();
        const normalized = normalizeInventory(raw);
        if (JSON.stringify(normalized) !== JSON.stringify(items)) {
          applyItems(normalized);
          persistCache();
          buildCategories();
          displayItems();
        }
        if (status) status.innerText = "🟢 Live";
      } catch (error) {
        if (status) status.innerText = "🟡 Offline";
      }
    }

    function buildCategories() {
      uniqueCategories.clear();
      uniqueCategories.add('All');
      items.forEach(item => uniqueCategories.add(item.category));

      let catHtml = [];
      uniqueCategories.forEach(cat => {
        const label = cat === 'All'
          ? (currentLang === 'mr' ? 'सर्व' : 'All')
          : (currentLang === 'mr' ? (categoryMarathiCache[cat] || cat) : cat);
        catHtml.push(`<button class="cat-btn ${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${label}</button>`);
      });
      const catBar = document.getElementById('categoryBar');
      if (catBar) catBar.innerHTML = catHtml.join('');

      let adminHtml = [];
      uniqueCategories.forEach(cat => { if (cat !== 'All') adminHtml.push(`<option value="${cat}">${cat}</option>`); });
      adminHtml.push(`<option value="__NEW__">+ Add New Category...</option>`);
      const adminSelect = document.getElementById('adminCategorySelect');
      if (adminSelect) adminSelect.innerHTML = adminHtml.join('');
    }

    // Instant Search Render — only resultsList is ever rebuilt, so the
    // search input's DOM node (and the keyboard/focus) is never touched.
    function displayItems() {
      const searchBar = document.getElementById('searchBar');
      const queryInput = searchBar ? searchBar.value.trim().toLowerCase() : '';
      const queryWords = queryInput.split(/\s+/).filter(w => w.length > 0);
      const resultsList = document.getElementById('resultsList');
      if (!resultsList) return;

      resultsList.className = isAdmin ? 'edit-mode' : '';

      let htmlBuffer = [];
      for (const item of items) {
        if (currentCategory !== 'All' && currentCategory !== item.category) continue;

        const searchTarget = (item.name + ' ' + (item._marathiName || '')).toLowerCase();
        if (queryWords.length > 0 && !queryWords.every(w => searchTarget.includes(w))) continue;

        const displayName = currentLang === 'mr' ? item._marathiName : item.name;
        const categoryLabel = currentLang === 'mr' ? (categoryMarathiCache[item.category] || item.category) : item.category;
        const priceDisplay = (item.price === '' || item.price === null || item.price === undefined || isNaN(item.price)) ? '—' : `₹${item.price}`;
        const safeKey = btoa(unescape(encodeURIComponent(item.key)));
        const thumbHtml = item.photo ? `<img class="item-thumb" src="${item.photo}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';

        htmlBuffer.push(`
          <div class="item-card">
            ${thumbHtml}
            <div class="item-wrapper">
              <div class="top-row">
                <div class="item-info">
                  <span class="item-name">${displayName}</span>
                  <span class="item-cat">${categoryLabel}</span>
                </div>
                <div class="item-price">${priceDisplay}</div>
              </div>
              <div class="admin-actions">
                <button class="action-btn btn-edit" onclick="editItem('${safeKey}')">✏️ Edit</button>
                <button class="action-btn btn-del" onclick="deleteItem('${safeKey}')">❌ Delete</button>
              </div>
            </div>
          </div>
        `);
      }
      resultsList.innerHTML = htmlBuffer.join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      buildCategories();
      displayItems();
    }

    function toggl
